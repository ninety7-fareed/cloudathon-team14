AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CounterGuide application stack. Aurora PostgreSQL Serverless v2 with a writer
  and a reader, one ECS Fargate service behind an internet-facing Application
  Load Balancer, target-tracking autoscaling, Secrets Manager, and CloudWatch.
  The load balancer accepts traffic only from the CloudFront origin-facing
  prefix list and only with the generated origin header. No EC2 instances.
  No automatic remediation. Deploy only as WSParticipantRole/Participant in
  account 231075364174, region us-east-1. Requires the network and repository
  stacks. Knowledge base IDs are parameters for bases that already exist.
  This stack does not import counterguide-knowledge and does not create a Bedrock agent.
  Do not use the local AWS CLI default profile.

Parameters:
  DeployRegion:
    Type: String
    Default: us-east-1
    AllowedValues: [us-east-1]
    Description: Verified deploy region from the Cloudathon@UH 2026 workshop page on 7 Nov 2026.
  NetworkStackName:
    Type: String
    Default: counterguide-network
  RepositoryStackName:
    Type: String
    Default: counterguide-repository
  ProductKnowledgeBaseId:
    Type: String
    Default: ZQ70XBP7SG
    AllowedPattern: "[A-Z0-9]{10}"
    Description: Existing product-guides knowledge base ID. This stack does not create it.
  RunbookKnowledgeBaseId:
    Type: String
    Default: DNNYCEGC0J
    AllowedPattern: "[A-Z0-9]{10}"
    Description: Existing operations-runbooks knowledge base ID. This stack does not create a Bedrock agent.
  GuidesDataSourceId:
    Type: String
    Default: 6GAIFSAUNX
    AllowedPattern: "[A-Z0-9]{10}"
    Description: Existing product-guides data source. Used only to report sync status.
  RunbooksDataSourceId:
    Type: String
    Default: HTOJ0UMO3J
    AllowedPattern: "[A-Z0-9]{10}"
    Description: Existing operations-runbooks data source. Used only to report sync status.
  ImageTag:
    Type: String
    Default: latest
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 4
    Description: Locked steady state is at least two tasks, across two Availability Zones.
  MaxTaskCount:
    Type: Number
    Default: 4
    MinValue: 2
    MaxValue: 8
  TargetCpu:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 90
    Description: Starting CPU target for target tracking. Not a measured baseline.
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]
  TaskMemory:
    Type: String
    Default: "1024"
    Description: Starting memory in MiB. 1024 is valid with 512 CPU. Not a measured size.
  AuroraEngineVersion:
    Type: String
    Default: "16.8"
    Description: Aurora PostgreSQL version offered in us-east-1. 16.6 is not available in this account.
  MinAcu:
    Type: Number
    Default: 0.5
    Description: Starting minimum Aurora capacity. This floor is a cost driver while the stack runs.
  MaxAcu:
    Type: Number
    Default: 4
  DbUsername:
    Type: String
    Default: counterguide
    AllowedPattern: "[a-z][a-z0-9]{1,15}"
    Description: Database user name. The password is generated in Secrets Manager. Do not pass a password.
  BackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 7
  FoundationModelId:
    Type: String
    Default: us.amazon.nova-pro-v1:0
    Description: >
      Assumption. Amazon Nova Pro inference profile for Guide chat.
      Model access is not confirmed enabled in account 231075364174.
  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    AllowedPattern: "pl-[0-9a-f]+"
    Description: >
      us-east-1 ID of the managed prefix list com.amazonaws.global.cloudfront.origin-facing.
      One rule consumes most of the security group rule quota. Do not add a second prefix-list rule.

Rules:
  WorkshopTarget:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Deploy only in us-east-1. Verified from the workshop page on 7 Nov 2026.
      - Assert: !Equals [!Ref "AWS::AccountId", "231075364174"]
        AssertDescription: Deploy only into Workshop Studio account 231075364174 as WSParticipantRole/Participant.
      - Assert: !Equals [!Ref DeployRegion, us-east-1]
        AssertDescription: DeployRegion is locked to us-east-1.

Resources:
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from CloudFront origin-facing addresses only
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing prefix list
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !Ref AppSg
          Description: Application tasks only
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-alb-sg" }]

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate tasks. No public IP. Egress is HTTPS, DNS, and Aurora.
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: AWS APIs through the NAT gateway in this Availability Zone
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcCidr" }
          Description: DNS to the VPC resolver
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcCidr" }
          Description: DNS to the VPC resolver
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-app-sg" }]

  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora from the Fargate security group only
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 127.0.0.1/32
          Description: Aurora does not initiate connections
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-db-sg" }]

  AlbToApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSg
      Description: Load balancer only

  AppToDb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSg
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppSg
      Description: Fargate tasks only

  AppEgressDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSg
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DbSg
      Description: Aurora only

  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: counterguide/origin-verify
      Description: Generated header value CloudFront sends and the load balancer requires.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CounterGuide Aurora subnets in two Availability Zones
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-DataSubnets" }]

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref AuroraEngineVersion
      DBClusterIdentifier: counterguide
      DatabaseName: counterguide
      Port: 5432
      MasterUsername: !Ref DbUsername
      ManageMasterUserPassword: true
      StorageEncrypted: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinAcu
        MaxCapacity: !Ref MaxAcu
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSg]
      BackupRetentionPeriod: !Ref BackupRetentionDays
      DeletionProtection: false
      EnableCloudwatchLogsExports: [postgresql]
      Tags: [{ Key: Name, Value: counterguide }]

  WriterInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceIdentifier: counterguide-writer
      DBInstanceClass: db.serverless
      AvailabilityZone: !Select [0, !GetAZs ""]
      PubliclyAccessible: false
      PromotionTier: 0
      Tags: [{ Key: Name, Value: counterguide-writer }]

  ReaderInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceIdentifier: counterguide-reader
      DBInstanceClass: db.serverless
      AvailabilityZone: !Select [1, !GetAZs ""]
      PubliclyAccessible: false
      PromotionTier: 1
      Tags: [{ Key: Name, Value: counterguide-reader }]

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /counterguide/application
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: counterguide-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pull-image-and-read-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub
                  - "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Repo}"
                  - Repo: { "Fn::ImportValue": !Sub "${RepositoryStackName}-RepositoryName" }
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource:
                  - !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
                  - !Ref OriginVerifySecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: counterguide-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-this-application-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:Retrieve]
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${ProductKnowledgeBaseId}"
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${FoundationModelId}"
              - Effect: Allow
                Action:
                  - bedrock:GetKnowledgeBase
                  - bedrock:ListIngestionJobs
                  - bedrock:GetIngestionJob
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${ProductKnowledgeBaseId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${RunbookKnowledgeBaseId}"
              - Effect: Allow
                Action: [cloudwatch:DescribeAlarms]
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:counterguide-*"
              - Effect: Allow
                Action: [elasticloadbalancing:DescribeTargetHealth]
                Resource: !Ref TargetGroup
              - Effect: Allow
                Action: [ecs:DescribeServices]
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/counterguide/counterguide"
              - Effect: Allow
                Action: [rds:DescribeDBClusters, rds:DescribeDBInstances]
                Resource:
                  - !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:counterguide"
                  - !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:counterguide-writer"
                  - !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:counterguide-reader"
              - Effect: Allow
                Action: [logs:FilterLogEvents, logs:DescribeLogStreams]
                Resource:
                  - !Sub "${LogGroup.Arn}:*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/cluster/counterguide/postgresql:*"
              - Effect: Deny
                Action:
                  - ec2:*
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:RunTask
                  - ecs:StopTask
                  - elasticloadbalancing:Create*
                  - elasticloadbalancing:Delete*
                  - elasticloadbalancing:Modify*
                  - elasticloadbalancing:Register*
                  - elasticloadbalancing:Deregister*
                  - elasticloadbalancing:Set*
                  - rds:Modify*
                  - rds:Delete*
                  - rds:Create*
                  - rds:Reboot*
                  - cloudformation:*
                  - iam:*
                  - ssm:SendCommand
                  - ssm:StartSession
                  - s3:DeleteBucket
                  - s3:PutObject
                  - bedrock:Create*
                  - bedrock:Delete*
                  - bedrock:Update*
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: counterguide
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: counterguide
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: { "Fn::ImportValue": !Sub "${RepositoryStackName}-RepositoryUri" }
              Tag: !Ref ImageTag
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - { Name: DB_HOST, Value: !GetAtt DatabaseCluster.Endpoint.Address }
            - { Name: DB_READER_HOST, Value: !GetAtt DatabaseCluster.ReadEndpoint.Address }
            - { Name: DB_NAME, Value: counterguide }
            - { Name: DB_PORT, Value: "5432" }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: PRODUCT_KB_ID, Value: !Ref ProductKnowledgeBaseId }
            - { Name: RUNBOOK_KB_ID, Value: !Ref RunbookKnowledgeBaseId }
            - { Name: GUIDES_DATA_SOURCE_ID, Value: !Ref GuidesDataSourceId }
            - { Name: RUNBOOKS_DATA_SOURCE_ID, Value: !Ref RunbooksDataSourceId }
            - { Name: FOUNDATION_MODEL_ID, Value: !Ref FoundationModelId }
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Join
                - ""
                - - !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
                  - ":username::"
            - Name: DB_PASSWORD
              ValueFrom: !Join
                - ""
                - - !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
                  - ":password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: app

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: counterguide
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: counterguide-app
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: counterguide
      Type: application
      Scheme: internet-facing
      Subnets: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-PublicSubnets" }]
      SecurityGroups: [!Ref AlbSg]
      Tags: [{ Key: Name, Value: counterguide }]

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn: OriginVerifySecret
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: forbidden

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DependsOn: OriginVerifySecret
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - "{{resolve:secretsmanager:counterguide/origin-verify:SecretString}}"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: [ListenerRule, AppToDb]
    Properties:
      ServiceName: counterguide
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: false
      HealthCheckGracePeriodSeconds: 120
      AvailabilityZoneRebalancing: ENABLED
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref AppSg]
          Subnets: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-AppSubnets" }]
      LoadBalancers:
        - ContainerName: counterguide
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: !Ref DesiredCount
      MaxCapacity: !Ref MaxTaskCount
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: counterguide-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref TargetCpu
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: counterguide-unhealthy-targets
      AlarmDescription: At least one CounterGuide target is unhealthy.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LowHealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: counterguide-healthy-targets-low
      AlarmDescription: Fewer than two healthy CounterGuide targets.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 2
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  RunningTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: counterguide-running-tasks-low
      AlarmDescription: Fewer than two running CounterGuide tasks.
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt Service.Name
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 2
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching

  AuroraCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: counterguide-aurora-cpu
      AlarmDescription: Starting threshold. Aurora writer CPU is high. Not a measured baseline.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref WriterInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
    Export: { Name: !Sub "${AWS::StackName}-AlbDnsName" }
  DatabaseEndpoint:
    Value: !GetAtt DatabaseCluster.Endpoint.Address
  DatabaseReaderEndpoint:
    Value: !GetAtt DatabaseCluster.ReadEndpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
  OriginSecretName:
    Value: counterguide/origin-verify
    Export: { Name: !Sub "${AWS::StackName}-OriginSecretName" }
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
