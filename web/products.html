<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CounterGuide - Product page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>CounterGuide</h1>
  <nav><a href="index.html">Guide chat</a> <a href="products.html" class="active">Product page</a> <a href="platform.html">Shiftlead (platform team)</a></nav>
</header>
<main>
  <p class="hint">Catalog read live from Aurora through the application tier.</p>
  <select id="cat">
    <option value="">All categories</option>
    <option>batteries</option><option>hobby equipment</option><option>cell phones</option><option>electronics</option>
  </select>
  <table id="t"><thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th></tr></thead><tbody><tr><td colspan="5">Loading...</td></tr></tbody></table>
  <p id="err" class="err" hidden></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function load(){
  $('err').hidden = true;
  const c = $('cat').value;
  try {
    const r = await fetch('/api/products' + (c ? '?category=' + encodeURIComponent(c) : ''));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    $('t').querySelector('tbody').innerHTML = d.products.map(p => `<tr><td>${esc(p.sku)}</td><td title="${esc(p.description)}">${esc(p.name)}</td><td>${esc(p.category)}</td><td>$${esc(p.price)}</td><td>${esc(p.stock)}</td></tr>`).join('');
  } catch (e) { $('err').textContent = 'Product page error: ' + e.message; $('err').hidden = false; }
}
$('cat').onchange = load; load();
</script>
</body>
</html>
